---
- name: Deploy the applications to the servers
  hosts: application_servers

  vars:
    repo_dir: "{{ playbook_dir }}/../../.."
    project_dir: /opt/devops-php-infrastructure
    only_apps: []
    skip_setup: false
    after_upgrade: false

    rsync_excludes:
      - /.git
      - /src/.env
      - /docker/php/Dockerfile.backup
      - /src/vendor/
      - /src/node_modules/
      - /src/storage/logs/
      - /src/storage/framework/cache/
      - /src/storage/framework/sessions/
      - /src/storage/framework/views/
      - /src/database/*.sqlite

    health_retries: 12
    health_delay: 5

  tasks:
    - name: Choose the applications to deploy
      ansible.builtin.set_fact:
        selected_apps: "{{ apps if only_apps | length == 0 else apps | selectattr('name', 'in', only_apps) | list }}"

    - name: Show what is going to be deployed
      ansible.builtin.debug:
        msg: "{{ selected_apps | map(attribute='name') | join(', ') }} -> {{ inventory_hostname }}"

    - name: Create the folder of each application
      ansible.builtin.file:
        path: "{{ project_dir }}/{{ item.dir }}"
        state: directory
        mode: "0755"
      loop: "{{ selected_apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Copy the files with rsync
      ansible.posix.synchronize:
        src: "{{ repo_dir }}/{{ item.dir }}/"
        dest: "{{ project_dir }}/{{ item.dir }}/"
        delete: true
        recursive: true
        rsync_opts: "{{ rsync_excludes | map('regex_replace', '^', '--exclude=') | list }}"
      loop: "{{ selected_apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create .env from .env.example the first time
      ansible.builtin.copy:
        src: "{{ project_dir }}/{{ item.dir }}/src/.env.example"
        dest: "{{ project_dir }}/{{ item.dir }}/src/.env"
        remote_src: true
        force: false
        mode: "0644"
      loop: "{{ selected_apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create the writable folders and open them to php-fpm
      ansible.builtin.shell: |
        cd {{ project_dir }}/{{ item.dir }}/src
        [ -f .env ] && chmod 0644 .env
        if [ -f artisan ]; then
          mkdir -p storage/logs storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
        elif [ -d storage ]; then
          mkdir -p storage/logs
        fi
        for d in storage bootstrap/cache; do
          [ -d "$d" ] && chmod -R 0777 "$d"
        done
        exit 0
      loop: "{{ selected_apps }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

    - name: Start the containers
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ project_dir }}/{{ item.dir }}"
      loop: "{{ selected_apps }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

    - name: Run the setup commands inside the php container
      ansible.builtin.command:
        cmd: docker compose exec -T php {{ item.1 }}
        chdir: "{{ project_dir }}/{{ item.0.dir }}"
      loop: "{{ selected_apps | subelements('setup', skip_missing=true) }}"
      loop_control:
        label: "{{ item.0.name }}: {{ item.1 }}"
      when: not (skip_setup | bool) and ((after_upgrade | bool) or not (item.0.blocked | default(false)))
      changed_when: true
      register: setup
      failed_when: false

    - name: Show the setup commands that failed
      ansible.builtin.debug:
        msg: "{{ item.item.0.name }} - '{{ item.item.1 }}' failed: {{ item.stderr | default(item.stdout) | default('') | truncate(300) }}"
      loop: "{{ setup.results }}"
      loop_control:
        label: "{{ item.item.0.name }}"
      when: item.rc | default(0) != 0

    - name: Look for a Laravel application without an application key
      ansible.builtin.shell:
        cmd: test -f src/artisan && grep -q '^APP_KEY=$' src/.env
        chdir: "{{ project_dir }}/{{ item.dir }}"
      loop: "{{ selected_apps }}"
      loop_control:
        label: "{{ item.name }}"
      register: appkey
      failed_when: false
      changed_when: false

    - name: Generate the application key on the first deployment
      ansible.builtin.command:
        cmd: docker compose exec -T php php artisan key:generate --force
        chdir: "{{ project_dir }}/{{ item.item.dir }}"
      loop: "{{ appkey.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.rc == 0 and not (skip_setup | bool) and ((after_upgrade | bool) or not (item.item.blocked | default(false)))
      changed_when: true

    - name: Restart php and nginx so they pick up the new code and configuration
      ansible.builtin.command:
        cmd: docker compose restart php nginx
        chdir: "{{ project_dir }}/{{ item.dir }}"
      loop: "{{ selected_apps }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

    - name: Wait for the applications to answer
      ansible.builtin.uri:
        url: "http://localhost:{{ item.port }}{{ item.health }}"
        status_code: 200
        timeout: 5
      loop: "{{ selected_apps }}"
      loop_control:
        label: "{{ item.name }}"
      register: health
      retries: "{{ health_retries }}"
      delay: "{{ health_delay }}"
      until: health is success
      failed_when: false

    - name: Show the result for each application
      ansible.builtin.debug:
        msg: >-
          {{ item.item.name }}:
          {{ 'OK' if item.status | default(0) == 200
             else ('DOWN - blocked by the PHP version, expected until the upgrade'
                   if item.item.blocked | default(false) else 'NOT ANSWERING') }}
      loop: "{{ health.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Fail if an application is not answering
      ansible.builtin.fail:
        msg: "{{ item.item.name }} is not answering after the deployment"
      loop: "{{ health.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - item.status | default(0) != 200
        - (after_upgrade | bool) or not (item.item.blocked | default(false))