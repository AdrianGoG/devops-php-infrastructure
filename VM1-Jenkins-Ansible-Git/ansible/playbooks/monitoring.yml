---
- name: Install node_exporter on the application servers
  hosts: application_servers

  vars:
    repo_dir: "{{ playbook_dir }}/../../.."
    monitoring_dir: /opt/monitoring

  tasks:
    - name: Create the monitoring folder
      ansible.builtin.file:
        path: "{{ monitoring_dir }}"
        state: directory
        mode: "0755"
      become: true

    - name: Copy the node_exporter compose file
      ansible.builtin.copy:
        src: "{{ repo_dir }}/monitoring/node-exporter/docker-compose.yml"
        dest: "{{ monitoring_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Start node_exporter
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ monitoring_dir }}"
      changed_when: true

    - name: Wait for node_exporter to answer
      ansible.builtin.uri:
        url: http://localhost:9100/metrics
        status_code: 200
        timeout: 5
      register: exporter
      retries: 6
      delay: 5
      until: exporter is success

    - name: Report
      ansible.builtin.debug:
        msg: "node_exporter is running on {{ inventory_hostname }}:9100"