---
- name: Roll back the PHP version of the applications
  hosts: application_servers

  vars:
    project_dir: /opt/devops-php-infrastructure
    only_apps: []
    only_blocked: false

  tasks:
    - name: Choose the applications to roll back
      ansible.builtin.set_fact:
        selected_apps: "{{ apps if only_apps | length == 0 else apps | selectattr('name', 'in', only_apps) | list }}"

    - name: Keep only the applications the upgrade was meant to unblock
      ansible.builtin.set_fact:
        selected_apps: "{{ selected_apps | selectattr('blocked', 'defined') | selectattr('blocked') | list }}"
      when: only_blocked | bool

    - name: Look for the backups
      ansible.builtin.stat:
        path: "{{ project_dir }}/{{ item.dir }}/docker/php/Dockerfile.backup"
      loop: "{{ selected_apps }}"
      loop_control:
        label: "{{ item.name }}"
      register: backups

    - name: Say which applications have no backup
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: no Dockerfile.backup, nothing to roll back"
      loop: "{{ backups.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not item.stat.exists

    - name: Put the old Dockerfile back
      ansible.builtin.copy:
        src: "{{ project_dir }}/{{ item.item.dir }}/docker/php/Dockerfile.backup"
        dest: "{{ project_dir }}/{{ item.item.dir }}/docker/php/Dockerfile"
        remote_src: true
        mode: "0644"
      loop: "{{ backups.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.stat.exists

    - name: Remove the dependencies of the applications the upgrade unblocked
      ansible.builtin.command:
        cmd: docker compose exec -T php rm -rf vendor
        chdir: "{{ project_dir }}/{{ item.item.dir }}"
      loop: "{{ backups.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - item.stat.exists
        - item.item.blocked | default(false)
      failed_when: false
      changed_when: true

    - name: Rebuild the containers
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ project_dir }}/{{ item.item.dir }}"
      loop: "{{ backups.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.stat.exists
      changed_when: true

    - name: Report
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: rebuilt from Dockerfile.backup"
      loop: "{{ backups.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.stat.exists