global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'servers'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          server: vm1
      - targets: ['192.168.0.169:9100']
        labels:
          server: vm2
      - targets: ['192.168.0.105:9100']
        labels:
          server: vm3
      - targets: ['192.168.0.125:9100']
        labels:
          server: vm4

  - job_name: 'estate'
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.0.125:8083']
        labels:
          application: app-monitor

  - job_name: 'registry'
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.0.169:8083']
        labels:
          application: app-api